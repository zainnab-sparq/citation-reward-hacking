[project]
name = "citation-reward-hacking"
version = "0.1.0"
description = "Empirical investigation of fake citations as reward hacking"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zain Naboulsi" }]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.9.0",
    "rapidfuzz>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.44.0",
    "vllm>=0.6.0",
    "datasets>=3.1.0",
    "h5py>=3.12.0",
    # E4's DeBERTa-v3 arm: transformers 5.x converts the sentencepiece vocab via
    # tiktoken, so both are needed to load the tokenizer at all.
    "sentencepiece>=0.2.0",
    "tiktoken>=0.8.0",
    "protobuf>=5.28.0",
]
construction = [
    "sentence-transformers>=3.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
